version: v2
inputs:
  - directory: api/proto
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/example/myapp
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/example/myapp
  - local: protoc-gen-grpc-gateway
    out: .
    opt:
      - module=github.com/example/myapp
      - generate_unbound_methods=true
  - local: protoc-gen-openapiv2
    out: api/openapi
    opt:
      - allow_merge=true
      - merge_file_name=customerv1
      - json_names_for_fields=false
