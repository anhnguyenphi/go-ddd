# CI: one job per test layer, run in parallel. See docs/agent/testing.md.
#
#   lint         golangci-lint (pinned in scripts/install-tools.sh), all build tags
#   unit         unit + arch + contract
#   integration  adapter integration tests against real Postgres + Redpanda (testcontainers)
#   e2e          the black-box e2e suite against real binaries, run in a harness
#                sandbox (no scratch checks: regression lives in tests/)
#   vuln         govulncheck
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/install-tools.sh lint
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go vet -tags=integration,contract,e2e ./...
      - run: make test
      - run: make test-contract

  integration:
    runs-on: ubuntu-latest
    env:
      REQUIRE_INFRA: "1" # fail, don't skip, if Docker is missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration

  e2e:
    runs-on: ubuntu-latest
    env:
      SANDBOX: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Scratch checks are gitignored, so in CI this runs exactly: a sandbox
      # (real api + worker, Postgres, Redpanda, WireMock), tests/e2e against
      # it, and the gates (no unmatched downstream calls, no unexpected errors).
      - name: e2e scenarios in a harness sandbox
        run: make GO="$(which go)" harness-verify ARGS=--e2e
      - name: harness report
        if: always()
        run: cat tmp/harness/ci/report.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harness
          path: tmp/harness/ci/
          if-no-files-found: ignore
      - if: always()
        run: make harness-down ARGS=--purge
