syntax = "proto3";

// Customer context — gRPC delivery contract and integration-event schemas.
package customer.v1;

option go_package = "github.com/example/myapp/api/proto/customer/v1;customerv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// This info block becomes the title of the whole merged OpenAPI doc (see
// buf.gen.yaml's openapiv2 `allow_merge`/`merge_file_name`) — every
// context's REST-annotated RPCs land in one api/openapi/customerv1.swagger.json,
// not just customer's, since it's the only proto in this tree that sets one.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "myapp API";
    version: "1.0.0";
    description: "REST surface for this app's bounded contexts, transcoded by grpc-gateway from their gRPC contracts (customer.v1, order.v1, ...).";
  }
};

// ---- gRPC service ----------------------------------------------------------
// REST is not a separate hand-written adapter: grpc-gateway transcodes these
// same RPCs to HTTP/JSON per the google.api.http annotations below, and the
// OpenAPI doc is generated from this file (see Makefile's `proto` target).

service CustomerService {
  // Register a new customer.
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse) {
    option (google.api.http) = {
      post: "/api/v1/customers"
      body: "*"
    };
  }
  // Get one customer.
  rpc GetCustomer(GetCustomerRequest) returns (Customer) {
    option (google.api.http) = {
      get: "/api/v1/customers/{id}"
    };
  }
  // List customers (from the read model).
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (google.api.http) = {
      get: "/api/v1/customers"
    };
  }
  // Change a customer's email address.
  rpc ChangeCustomerEmail(ChangeCustomerEmailRequest) returns (ChangeCustomerEmailResponse) {
    option (google.api.http) = {
      patch: "/api/v1/customers/{id}/email"
      body: "*"
    };
  }
}

message Customer {
  string id = 1;
  string name = 2;
  string email = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateCustomerRequest {
  string name = 1;
  string email = 2;
}
message CreateCustomerResponse { string id = 1; }

message GetCustomerRequest { string id = 1; }

message ListCustomersRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListCustomersResponse {
  repeated Customer items = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ChangeCustomerEmailRequest {
  string id = 1;
  string email = 2;
}
message ChangeCustomerEmailResponse {}

// ---- integration events (published on the bus) ----------------------------
// Topic (bounded-context oriented): customer.v1.events

message CustomerCreatedV1 {
  string id = 1;
  string name = 2;
  string email = 3;
}

message CustomerEmailChangedV1 {
  string id = 1;
  string old_email = 2;
  string new_email = 3;
}

message CustomerDeactivatedV1 {
  string id = 1;
  string reason = 2;
}
