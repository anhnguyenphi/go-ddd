version: v2
inputs:
  - directory: api/proto
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/example/myapp
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/example/myapp
  - local: protoc-gen-grpc-gateway
    out: .
    opt:
      - module=github.com/example/myapp
      - generate_unbound_methods=true
  - local: protoc-gen-openapiv2
    out: api/openapi
    opt:
      - allow_merge=true
      - merge_file_name=myappv1
      - json_names_for_fields=false
    # buf's default per-directory invocation strategy runs this plugin once
    # per proto package (customer/v1, order/v1, ...), each independently
    # trying to write merge_file_name — the second write silently clobbers
    # the first. "all" invokes it once across every target file so allow_merge
    # actually merges, matching a plain `protoc --openapiv2_out=...` call.
    strategy: all
