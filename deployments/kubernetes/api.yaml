apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-api
  namespace: myapp
  labels: { app: myapp, component: api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: myapp, component: api }
  template:
    metadata:
      labels: { app: myapp, component: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/myapp-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: myapp-config }
            - secretRef: { name: myapp-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-api
  namespace: myapp
spec:
  selector: { app: myapp, component: api }
  ports:
    - port: 80
      targetPort: 8080
