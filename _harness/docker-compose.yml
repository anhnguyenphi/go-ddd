# Shared harness infra: the real datastore and broker, plus WireMock standing
# in for every downstream HTTP service. ONE stack per machine, shared by every
# sandbox (one per worktree). Each sandbox gets its own slice: a database
# (myapp_sb_<name>), Kafka topics (sb_<name>.*) and consumer group, and a
# WireMock path prefix (/sb_<name>/). Its api and worker run on the host,
# built from its worktree, on their own ports. See _harness/scripts/lib.sh.
#
# Isolated from the dev stack in deployments/docker on purpose: its own
# project name, ports (5xxxx) and volume, so the harness never touches a
# developer's local database and both can run side by side.
#
# Driven by _harness/scripts/*.sh (infra.sh); don't `docker compose up` it by hand.
# infra.sh leaves a running stack alone, so a change to this file takes effect
# only after `make harness-infra-down ARGS=--force` (when no other sandbox is
# in use) and the next `make harness-up`.

name: myapp-harness

services:
  postgres:
    image: postgres:16-alpine
    # Every sandbox runs an api and a worker with their own pool on this one
    # server (capped per process by DATABASE_MAX_OPEN_CONNS in .env.harness).
    # The default of 100 connections is too tight for many sandboxes at once.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: harness-fake-password
      # Only the maintenance DB; each sandbox creates its own myapp_sb_<name>.
      POSTGRES_DB: myapp_harness
    ports:
      - "55432:5432"
    volumes:
      - harness-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp_harness"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:59092
      - --advertise-kafka-addr=PLAINTEXT://localhost:59092
    ports:
      - "59092:59092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:59092 | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One path prefix per sandbox, then per downstream service
  # (/sb_<name>/payments/...). Stubs are the files in _harness/mocks, pushed in
  # through the admin API (/__admin) by up.sh with the sandbox prefix added,
  # not mounted: see mock_reset in scripts/lib.sh. Anything unstubbed gets a
  # 404 and is journaled as unmatched, which fails that sandbox's run.
  wiremock:
    image: wiremock/wiremock:3.9.1
    # The journal is shared and otherwise grows without bound: every sandbox
    # reads its part of it on each poll. Each sandbox saves what it needs
    # (mock_stash_unmatched) long before 20000 newer requests arrive.
    command: ["--disable-banner", "--max-request-journal-entries", "20000"]
    ports:
      - "59999:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  harness-pgdata:
